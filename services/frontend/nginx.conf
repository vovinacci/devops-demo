server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # SPA fallback - all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy for API - remove /api prefix.
    # The upstream is substituted at container start (nginx's own
    # /docker-entrypoint.d/20-envsubst-on-templates.sh) because the backend's
    # address is not the same string everywhere: `api` is the compose service
    # name, while Kubernetes names it <release>-backend. Only ${...} forms are
    # substituted, so the bare $uri/$host nginx variables below are untouched.
    location /api/ {
        proxy_pass ${FRONTEND_BACKEND_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    
    # Handle /api without trailing slash
    location = /api {
        return 301 /api/;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
