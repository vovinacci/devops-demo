[package]
name = "canary"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
# default-features off: the default "protobuf" feature pulls protobuf
# 3.7.2 in for the protobuf exposition format, which the canary never
# emits -- /metrics is TextEncoder only (src/metrics.rs). Dropping it
# also drops the last consumer of thiserror 1.x, so cargo-deny stops
# warning about a duplicate thiserror.
prometheus = { version = "0.14.0", default-features = false }
# default-features off: the canary only ever calls the backend over
# plain HTTP inside the compose network (never TLS), so the TLS stack
# and its runtime dependency on a system CA bundle are dropped entirely
# rather than worked around in the runtime image.
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6.5"
