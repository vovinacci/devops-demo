# Reports service configuration (RFC-0001 D2, D6, D10, D11).
# Env vars follow the repo's per-service prefix convention (REPORTS_*),
# mirroring analytics' ANALYTICS_* and the backend's own vars; the compose
# `reports` profile sets them, the defaults here target a locally-run
# `./gradlew bootRun` against `postgres-reports` on host port 5434.
spring:
  application:
    name: reports
  # Report generation (PR-2) is blocking (Apache POI / PDF); JDK 21 virtual
  # threads carry that work without a reactive rewrite -- the D2 "heavyweight
  # framework is the lesson" stack (Spring MVC + JDBC), not WebFlux.
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${REPORTS_DATABASE_URL:jdbc:postgresql://localhost:5434/reports}
    username: ${REPORTS_DATABASE_USER:reports}
    password: ${REPORTS_DATABASE_PASSWORD:reports}
    hikari:
      # Fail readiness fast when Postgres is down instead of blocking a
      # /readyz probe for the JDBC default (30s).
      connection-timeout: 3000
      # Keep the Hikari pool lazy: it starts immediately and opens connections
      # on first use, so a *running* app that later loses Postgres keeps
      # /healthz at 200 (liveness never depends on the DB) while /readyz reports
      # 503 via the Actuator `db` indicator (D6). The readiness/liveness split
      # still holds exactly as in PR-1.
      #
      # What changed in PR-2: Flyway (below) runs migrations at startup and
      # needs Postgres reachable *then*, so the app no longer boots with the DB
      # absent -- Flyway makes Postgres a startup dependency. That is fine and
      # deliberate: compose gates `reports` on `postgres-reports:
      # service_healthy`, and the Testcontainers tests start Postgres first, so
      # the DB is always up at migration time. spring.flyway.connect-retries
      # covers a DB that is merely slow to accept connections at boot.
      # (Distinct from D10 graceful degradation, which is about the *optional*
      # analytics upstream, not this own-store hard dependency.)
      initialization-fail-timeout: -1
  # Flyway migrations for report_jobs (PR-2, RFC-0001 D2). connect-retries lets
  # a Postgres that is up-but-not-yet-accepting-connections at startup settle
  # before the migration gives up (compose orders postgres-reports first, but a
  # cold boot can still race the first connection).
  flyway:
    enabled: true
    connect-retries: 10
    connect-retries-interval: 3s

server:
  port: ${REPORTS_HTTP_PORT:8083}
  shutdown: graceful

# Report engine settings (PR-2, RFC-0001 D2/D10). backend-url is the source of
# truth reports pulls items from; analytics-url is best-effort enrichment (D10
# graceful degradation, Hard rule 9) -- an unreachable analytics degrades the
# report's analytics section, it never fails the job. Defaults target locally-
# run services; the compose `reports` profile points them at the in-network
# hostnames.
reports:
  artifact-dir: ${REPORTS_ARTIFACT_DIR:./artifacts}
  backend-url: ${REPORTS_BACKEND_URL:http://localhost:8000}
  analytics-url: ${REPORTS_ANALYTICS_URL:http://localhost:8082}
  # Per-upstream HTTP timeouts (connect + request). Kept short so a hung or
  # absent analytics fails fast into the degraded path rather than stalling a
  # job (D10). Backend uses the same budget; a backend failure fails the job.
  http-timeout: ${REPORTS_HTTP_TIMEOUT:5s}
  # Bounded job concurrency (RFC-0001 D2): report jobs run on a fixed-size
  # dispatcher so bursty POI/PDF allocation is a controlled GC exhibit, not an
  # OOM. Small by design -- the point is to make GC visible, not to scale out.
  job-concurrency: ${REPORTS_JOB_CONCURRENCY:2}

# D6 uniform contract via Actuator: liveness/readiness health groups are
# surfaced at the exact /healthz and /readyz paths on the main server port
# (additional-path), and the Micrometer Prometheus endpoint is remapped to
# /metrics. Readiness includes the `db` indicator so it reflects Postgres
# connectivity (D6); liveness never depends on the DB.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
      # No actuator discovery/links page at `/`.
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: server:/healthz
        readiness:
          include: readinessState,db
          additional-path: server:/readyz
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      # Publish latency histogram buckets for HTTP server requests so the
      # reports Grafana dashboard's p95 panel has real quantiles to read
      # (the JVM showcase, RFC-0001 D2); without this Micrometer emits only
      # count/sum and histogram_quantile would return no data.
      percentiles-histogram:
        http.server.requests: true
        # Publish histogram buckets for the report-job duration timer so the
        # dashboard's job-duration p95 panel has real quantiles (PR-2).
        reports.job.duration: true
  # OpenTelemetry from day one (D11): every trace sampled so trace_id/span_id
  # reach the JSON logs. No exporter is configured -- spans are dropped, Loki
  # correlates on trace_id until Tempo lands (RFC-0001 Section 10).
  tracing:
    sampling:
      probability: 1.0
