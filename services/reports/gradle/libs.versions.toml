# Gradle version catalog (RFC-0001 D2 Phase 6). Toolchain pins (JDK, Gradle)
# live in the repo-root .mise.toml and gradle/wrapper; this catalog pins the
# JVM library ecosystem. Renovate updates it like every other manifest.
[versions]
# Kotlin tracks the version Spring Boot 3.5.x manages, so the Kotlin plugin
# and the Boot-managed kotlin-stdlib stay on the same line.
kotlin = "2.1.21"
springBoot = "3.5.16"
dependencyManagement = "1.1.7"
ktlintPlugin = "12.1.2"
ktlint = "1.5.0"
# Spring Boot's BOM does not manage the Logstash encoder, so it is pinned here.
logstashLogbackEncoder = "8.1"
# Override the Boot BOM's postgresql (42.7.11): that version is affected by
# CVE-2026-54291 (GHSA-j92g-9f8w-j867), a silent SCRAM channel-binding
# downgrade, fixed in 42.7.12. An explicit version on the dependency wins over
# the BOM (io.spring.dependency-management overriddenByDependencies default).
postgresql = "42.7.12"

[libraries]
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashLogbackEncoder" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
