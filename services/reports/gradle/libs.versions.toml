# Gradle version catalog (RFC-0001 D2 Phase 6). Toolchain pins (JDK, Gradle)
# live in the repo-root .mise.toml and gradle/wrapper; this catalog pins the
# JVM library ecosystem. Renovate updates it like every other manifest.
[versions]
# Kotlin tracks the version Spring Boot 4.1.x manages, so the Kotlin plugin
# and the Boot-managed kotlin-stdlib stay on the same line.
kotlin = "2.3.21"
# Spring Boot 4 / Spring Framework 7 (ADR-0020): the 6.2.x open-source line
# ended at 6.2.19, which is affected by CVE-2026-47884 and CVE-2026-47890.
springBoot = "4.1.1"
dependencyManagement = "1.1.7"
ktlintPlugin = "14.2.0"
ktlint = "1.8.0"
# Spring Boot's BOM does not manage the Logstash encoder, so it is pinned here.
# 9.x is the Jackson 3 line, matching Boot 4's Jackson.
logstashLogbackEncoder = "9.0"
# Override the Boot BOM's embedded Tomcat (11.0.24 in Boot 4.1.1): affected
# by CVE-2026-65182, CVE-2026-65905 and CVE-2026-68525 (security-constraint,
# DIGEST and FORM authentication bypasses), fixed in 11.0.25+. Tomcat is a
# transitive of spring-boot-starter-webmvc, so the override goes through the
# BOM's `tomcat.version` property (build.gradle.kts) and covers embed-core,
# embed-el and embed-websocket together. Drop once the Boot BOM manages
# 11.0.27 or later.
tomcat = "11.0.27"
# Apache POI (PR-2, RFC-0001 D2): the XLSX generator and the deliberate
# bursty-allocation workload that makes the GC sawtooth visible. Not managed
# by the Boot BOM, pinned here; Renovate updates it like every other manifest.
poi = "5.4.1"
# OpenPDF (LibrePDF) is the PDF generator (PR-2): a maintained MPL/LGPL fork
# of iText 4, chosen over lower-level PDFBox for a concise document model and
# over modern iText 7+ (AGPL) for licence cleanliness. Boot does not manage
# it, pinned here.
openpdf = "2.0.3"

[libraries]
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashLogbackEncoder" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
openpdf = { module = "com.github.librepdf:openpdf", version.ref = "openpdf" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
