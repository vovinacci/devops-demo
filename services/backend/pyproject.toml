[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "devops-demo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "psycopg[binary]==3.3.4",
    "SQLAlchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    "python-dotenv==1.2.2",
    "prometheus-client==0.25.0",
    "httpx==0.28.1",
    "grpcio==1.82.1",
    "grpcio-health-checking==1.82.1",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-grpc==0.65b0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.2.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.21",
    "grpcio-tools==1.82.1",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[tool.pytest.ini_options]
# Use auto mode for compatibility with anyio (Starlette)
asyncio_mode = "auto"
# One event loop for the whole suite: the engine (and its connection
# pool) is module-global, and pooled asyncpg connections are bound to
# the loop they were created on -- per-test loops would poison the pool
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true
# proto_gen is generate-in-build (RFC-0001 D8), never committed -- generated
# code is not lint/type-check scope
exclude = ["app/proto_gen"]

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "prometheus_client.*",
    "grpc.*",
    "grpc_health.*",
    "opentelemetry.instrumentation.fastapi.*",
    "opentelemetry.instrumentation.grpc.*",
]
ignore_missing_imports = true
