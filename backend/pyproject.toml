[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "devops-demo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.129.0",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
    "psycopg[binary]==3.3.2",
    "SQLAlchemy[asyncio]==2.0.46",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "python-dotenv==1.2.1",
    "prometheus-client==0.24.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.1",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[tool.pytest.ini_options]
# Use auto mode for compatibility with anyio (Starlette)
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 160
include = ["**/*.py", "**/*.pyi"]
extend-exclude = ["venv", ".venv", "__pycache__", "alembic/versions"]

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, N — pep8-naming, UP — pyupgrade
# I — import sorting (isort), B — bugbear, SIM — simplify
# C4 — comprehensions, RUF — Ruff-specific rules
select = ["E", "W", "F", "N", "UP", "I", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "C408", "C409", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "prometheus_client.*",
]
ignore_missing_imports = true
