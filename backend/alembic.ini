[alembic]
script_location = alembic
# Tell Alembic to take URL from env variable (we already pass it as ALEMBIC_DATABASE_URL)
sqlalchemy.url = %(ALEMBIC_DATABASE_URL)s

# --- Logging (minimum, so fileConfig doesn't fail) ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
