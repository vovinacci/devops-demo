# Reproducible developer toolchain (ADR-0012).
# Install mise (https://mise.jdx.dev), then run: mise install
# Verify the full environment with: make doctor
#
# Careful: bare "mise use <tool>" REWRITES this file with "latest" --
# pin explicitly ("mise use python@3.12") or just edit this file.
#
# Versions are pinned at minor level: the patch floats at install time,
# and the Renovate runtime policy allows patch-only bumps for Python/Go.
# Toolchains for future services (JDK, k6) are added in the phase that
# introduces them (engineering-principles.md Section 6).

[tools]
python = "3.12"
node = "24"
rust = "1.97"
go = "1.26"
buf = "1.72"
k6 = "2.1"
# JDK pinned at LTS major (Temurin), Gradle at minor -- added in Phase 6
# with the Kotlin reports service (RFC-0001 D2). The reports Dockerfile
# FROM lines and the committed Gradle wrapper are checked against these by
# scripts/check-toolchain-drift.sh.
java = "temurin-21"
gradle = "8.14"
