# Reproducible developer toolchain (RFC-0001 D14).
# Install mise (https://mise.jdx.dev), then run: mise install
# Verify the full environment with: make doctor
#
# Versions are pinned at minor level: the patch floats at install time,
# and the Renovate runtime policy allows patch-only bumps for Python/Go.
# Toolchains for future services (Go, Rust, JDK, buf, k6) are added in
# the phase that introduces them (engineering-principles.md Section 6).

[tools]
python = "3.12"
node = "24"
