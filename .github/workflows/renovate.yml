name: Renovate

# Self-hosted Renovate (ADR-0009): runs inside our own Actions on a
# schedule instead of the hosted Mend app -- the automation stays in the
# repository as code. Repository config: .github/renovate.json5 (picked up
# by Renovate itself, not passed here). Requires the PR_PAT_TOKEN secret
# (PAT with repo scope) so the PRs it creates trigger CI.

on:
  schedule:
    # Monday 03:00 UTC -- inside the config's "before 6am on monday" window
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: renovate

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run Renovate
        uses: renovatebot/github-action@b50d2ba2bd928235abdcc14d06dfafc217f1c565 # v46.1.18
        with:
          token: ${{ secrets.PR_PAT_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
