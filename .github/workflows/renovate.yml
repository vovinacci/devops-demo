name: Renovate

# Self-hosted Renovate (ADR-0009): runs inside our own Actions on a
# schedule instead of the hosted Mend app -- the automation stays in the
# repository as code. Repository config: .github/renovate.json5 (picked up
# by Renovate itself, not passed here). Requires the PR_PAT_TOKEN secret
# (PAT with repo scope) so the PRs it creates trigger CI.

on:
  schedule:
    # Monday 03:00 UTC -- inside the config's "before 6am on monday" window
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: renovate

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require PR_PAT_TOKEN
        env:
          TOKEN: ${{ secrets.PR_PAT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PR_PAT_TOKEN secret is not configured (PAT with repo + workflow scope)" >&2
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@0a7b68676027570f113b1d6e7b69b231b56167ab # v46.2.3
        with:
          token: ${{ secrets.PR_PAT_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
