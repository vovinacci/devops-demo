name: Nightly

# The "full" profile stage (RFC-0001 D12, PR-4): everything e2e.yml
# covers plus the `synthetic` profile (blackbox + canary) AND the
# `reports` JVM profile, both of which the PR-scoped e2e gate omits to
# stay within the standard 7 GB runner. As of Phase 6 PR-3 `reports` has
# landed and IS exercised here -- the JVM comes up under `--profile
# reports` and the k6 `report` scenario drives it (POST /reports -> poll
# -> download), enabled by LOADGEN_REPORTS_URL in the smoke-full target --
# never per-PR, per the RFC-0001 D12 CI resource constraint. "full" here
# means every profile the repo ships: core + analytics + synthetic +
# reports + load.
#
# This IS `make smoke-full` -- same make-ci-parity principle as e2e.yml;
# all the profile/env wiring lives in that target, so this workflow needs
# no reports-specific step of its own.

on:
  schedule:
    # 03:00 UTC -- outside typical US/EU working hours, low interference
    # with anyone actively developing against the same runners/images.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  nightly-smoke:
    name: nightly smoke (all current profiles)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: make smoke-full (bring-up + longer k6 gate + full assertions)
        run: make smoke-full

      - name: Dump compose state on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/docker-compose.yml --project-directory . --profile "*" ps
          docker compose -f deploy/compose/docker-compose.yml --project-directory . --profile "*" logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --project-directory . --profile "*" down -v
