name: Release Please

# Maintains a release PR from Conventional Commit history (ADR-0009).
# Merging the release PR tags vX.Y.Z and publishes a GitHub Release,
# which triggers release.yml. Squash-merge only: PR titles are the
# commit messages this action reads (enforced by the commitlint check).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # PAT (if configured) lets CI run on the release PR;
          # the default GITHUB_TOKEN does not trigger workflows.
          token: ${{ secrets.PR_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
