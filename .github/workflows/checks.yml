name: Checks

# Cross-cutting gates that run on every PR regardless of changed paths.
# These are the checks marked as required in branch protection (see
# docs/ci.md) -- path-filtered workflows cannot be required because a
# skipped workflow leaves its checks pending forever.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
  # weekly full-history secret scan (the prek hook only sees the working tree)
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hooks:
    name: Git hooks (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same tool and config as local `prek run --all-files` / `make lint-infra`
      - name: Run prek
        uses: j178/prek-action@0bb87d7f00b0c99306c8bcb8b8beba1eb581c037 # v1

  commitlint:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: services/frontend/.nvmrc

      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional

      # Squash-merge repo: the PR title becomes the commit message that
      # release-please reads, so the title is linted, not branch commits.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | commitlint --config commitlint.config.mjs

  gitleaks-history:
    name: Secret scan (full git history)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the whole point: scan every commit, not the checkout
          fetch-depth: 0

      - name: Run gitleaks over history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
