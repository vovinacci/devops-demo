name: Proto

# buf lint + format + breaking-change detection on the proto/ module
# (RFC-0001 D3/D12, ADR-0002). No BSR push: this repo does not publish to
# the Buf Schema Registry.

on:
  pull_request:
    paths:
      - "proto/**"
      - ".github/workflows/proto.yml"
  push:
    branches:
      - main
    paths:
      - "proto/**"
      - ".github/workflows/proto.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-proto:
    name: Lint + format proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: buf lint + format
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: "1.72.0" # keep in sync with .mise.toml (buf = "1.72")
          input: proto
          breaking: false
          push: false

  breaking-proto:
    name: buf breaking (against main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # main has no proto/ module until this PR merges -- `buf breaking`
      # against a ref where the module path does not exist errors rather
      # than skips, so check the baseline first. This guard becomes a
      # no-op the moment this PR merges (every later PR sees proto/ on
      # main) and can be removed once that history is old enough to trust.
      - name: Check baseline exists on main
        id: baseline
        # buf's ".git#branch=main" input clones the local .git and resolves
        # refs/heads only; checkout leaves main as a remote-tracking ref
        # (fatal: couldn't find remote ref main), so materialize it first.
        run: |
          git branch --force main origin/main
          if git ls-tree origin/main --name-only | grep -q '^proto$'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no proto/ on main yet (first PR) -- skipping buf breaking"
          fi

      - name: buf breaking
        if: steps.baseline.outputs.exists == 'true'
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: "1.72.0" # keep in sync with .mise.toml (buf = "1.72")
          input: proto
          lint: false
          format: false
          breaking_against: ".git#branch=main,subdir=proto"
          push: false
