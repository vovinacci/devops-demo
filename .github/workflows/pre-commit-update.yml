name: Update Pre-commit Hooks

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-hooks:
    name: Update Pre-commit Hooks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: 'backend/pyproject.toml'

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Update pre-commit hooks
        id: update
        run: |
          pre-commit autoupdate
          git diff --exit-code .pre-commit-config.yaml || echo "updated=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update pre-commit hooks to latest versions'
          title: 'chore: update pre-commit hooks to latest versions'
          body: |
            This PR automatically updates pre-commit hooks to their latest versions.

            **Changes:**
            - Updated hook versions in `.pre-commit-config.yaml`

            **Review checklist:**
            - [ ] Review the updated hook versions
            - [ ] Run `make pre-commit-run` locally to verify hooks work correctly
            - [ ] Check if any new hook behavior affects the codebase

            This PR was created automatically by the [Update Pre-commit Hooks](.github/workflows/pre-commit-update.yml) workflow.
          branch: chore/update-pre-commit-hooks
          delete-branch: true
