name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  release-placeholder:
    name: Release Placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # untrusted values reach the shell only via env, never by direct
      # interpolation into the script body (script-injection guard)
      - name: Get release version
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Display release info
        run: |
          echo "[release] workflow triggered"
          echo "Version: ${{ steps.get_version.outputs.version }}"
          echo "Event: ${{ github.event_name }}"
          echo ""
          echo "[note] Placeholder: no actual release artifacts are created."
          echo "In production, this workflow would:"
          echo "  - Build Docker images"
          echo "  - Push to container registry"
          echo "  - Create deployment artifacts"
          echo "  - Update documentation"
          echo "  - Send notifications"

      - name: Build backend image (placeholder)
        run: |
          echo "Would build backend Docker image for version ${{ steps.get_version.outputs.version }}"
          # docker build -t devops-demo-backend:${{ steps.get_version.outputs.version }} ./services/backend

      - name: Build frontend image (placeholder)
        run: |
          echo "Would build frontend Docker image for version ${{ steps.get_version.outputs.version }}"
          # docker build -t devops-demo-frontend:${{ steps.get_version.outputs.version }} ./services/frontend

      - name: Release summary
        run: |
          echo "[ok] Release workflow completed (placeholder)"
          echo "Version: ${{ steps.get_version.outputs.version }}"
          echo "Commit: ${{ github.sha }}"
