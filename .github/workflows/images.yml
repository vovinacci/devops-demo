name: Images

# Build each service image and scan it with Trivy (ADR-0011):
# a critical CVE in a shipped image fails the pipeline.

on:
  # weekly rescan of unchanged images: new CVEs appear without commits
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "services/**"
      - "deploy/compose/**"
      - ".github/workflows/images.yml"
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "deploy/compose/**"
      - ".github/workflows/images.yml"

jobs:
  build-scan:
    name: Build + Trivy scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # backend reaches the repo-root proto/ module as a named
          # additional build context to generate gRPC stubs at build time
          # (RFC-0001 D8, ADR-0002), without widening its own build context
          - service: backend
            extra_build_args: "--build-context proto=proto"
          - service: frontend
            extra_build_args: ""
          - service: canary
            extra_build_args: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # build+scan only, no pushes back -- do not leave the token in
          # the local git config
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull ${{ matrix.extra_build_args }} -t "devops-demo-${{ matrix.service }}:ci" "services/${{ matrix.service }}"

      - name: Trivy scan (fail on critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-demo-${{ matrix.service }}:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
