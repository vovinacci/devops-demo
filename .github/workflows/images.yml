name: Images

# Build each service image and scan it with Trivy (ADR-0011):
# a critical CVE in a shipped image fails the pipeline.

on:
  # weekly rescan of unchanged images: new CVEs appear without commits
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "services/**"
      - "deploy/compose/**"
      - "loadgen/**"
      - "loadprofile/**"
      - ".github/workflows/images.yml"
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "deploy/compose/**"
      - "loadgen/**"
      - "loadprofile/**"
      - ".github/workflows/images.yml"

jobs:
  build-scan:
    name: Build + Trivy scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # backend reaches the repo-root proto/ module as a named
          # additional build context to generate gRPC stubs at build time
          # (RFC-0001 D8, ADR-0002), without widening its own build context
          - service: backend
            context: services/backend
            extra_build_args: "--build-context proto=proto"
          - service: frontend
            context: services/frontend
            extra_build_args: ""
          - service: canary
            context: services/canary
            extra_build_args: ""
          # analytics reaches proto/ the same way backend does (RFC-0001
          # D8, ADR-0002): a named additional build context for Go gRPC
          # stub generation at build time.
          - service: analytics
            context: services/analytics
            extra_build_args: "--build-context proto=proto --build-context loadprofile=loadprofile"
          # reports builds from its own self-contained context (the committed
          # Gradle wrapper drives the build) -- no additional build contexts
          - service: reports
            context: services/reports
            extra_build_args: ""
          # loadgen lives at the repo root, not under services/ (RFC-0001
          # D8): its build context needs two named additional contexts,
          # same pattern as backend/analytics for proto/ above --
          # loadprofile/ (k6 imports shape.js/profile.json directly) and
          # proto/ (items.proto loaded at runtime), see deploy/compose and
          # loadgen/Dockerfile for the identical additional_contexts.
          - service: loadgen
            context: loadgen
            extra_build_args: "--build-context loadprofile=loadprofile --build-context proto=proto"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # build+scan only, no pushes back -- do not leave the token in
          # the local git config
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull ${{ matrix.extra_build_args }} -t "devops-demo-${{ matrix.service }}:ci" "${{ matrix.context }}"

      - name: Trivy scan (fail on critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-demo-${{ matrix.service }}:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
