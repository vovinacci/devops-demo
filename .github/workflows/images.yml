name: Images

# Build each service image and scan it with Trivy (ADR-0011):
# a critical CVE in a shipped image fails the pipeline.

on:
  # weekly rescan of unchanged images: new CVEs appear without commits
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "services/**"
      - "deploy/compose/**"
      - "loadgen/**"
      - "loadprofile/**"
      - "deploy/k8s/**"
      - ".github/workflows/images.yml"
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "deploy/compose/**"
      - "loadgen/**"
      - "loadprofile/**"
      - "deploy/k8s/**"
      - ".github/workflows/images.yml"

jobs:
  build-scan:
    name: Build + Trivy scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # backend reaches the repo-root proto/ module as a named
          # additional build context to generate gRPC stubs at build time
          # (RFC-0001 D8, ADR-0002), without widening its own build context
          - service: backend
            context: services/backend
            extra_build_args: "--build-context proto=proto"
          - service: frontend
            context: services/frontend
            extra_build_args: ""
          - service: canary
            context: services/canary
            extra_build_args: ""
          # analytics reaches proto/ the same way backend does (RFC-0001
          # D8, ADR-0002): a named additional build context for Go gRPC
          # stub generation at build time.
          - service: analytics
            context: services/analytics
            extra_build_args: "--build-context proto=proto --build-context loadprofile=loadprofile"
          # reports builds from its own self-contained context (the committed
          # Gradle wrapper drives the build) -- no additional build contexts
          - service: reports
            context: services/reports
            extra_build_args: ""
          # reports-ui (RFC-0002): self-contained Caddy static server + proxy;
          # the site is copied in verbatim (no build step, RFC-0002 D3), so no
          # additional build contexts.
          - service: reports-ui
            context: services/reports-ui
            extra_build_args: ""
          # loadgen lives at the repo root, not under services/ (RFC-0001
          # D8): its build context needs two named additional contexts,
          # same pattern as backend/analytics for proto/ above --
          # loadprofile/ (k6 imports shape.js/profile.json directly) and
          # proto/ (items.proto loaded at runtime), see deploy/compose and
          # loadgen/Dockerfile for the identical additional_contexts.
          - service: loadgen
            context: loadgen
            extra_build_args: "--build-context loadprofile=loadprofile --build-context proto=proto"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # build+scan only, no pushes back -- do not leave the token in
          # the local git config
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull ${{ matrix.extra_build_args }} -t "devops-demo-${{ matrix.service }}:ci" "${{ matrix.context }}"

      - name: Trivy scan (fail on critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-demo-${{ matrix.service }}:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # Third-party images (Prometheus, Grafana, Postgres, ...) are pulled, not
  # built here, and are just as reachable as our own code -- an unscanned
  # Grafana is an unscanned service. They are scanned on the same schedule,
  # but reported rather than gated: we cannot patch upstream, and a red
  # pipeline nobody can act on is one people learn to ignore. What we build
  # we gate; what we pull we watch. Both halves are documented in ADR-0011.
  #
  # The list is derived from the compose file, so there is no second
  # inventory to drift -- a new pulled image is scanned the day it lands.
  collect-third-party:
    name: Collect third-party images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # helm renders the Kubernetes side of the inventory (see below).
      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
          cache: true

      - name: Install helm (pinned in .mise.toml)
        run: mise install helm

      - name: Extract pulled images from compose and from the Kind cluster
        id: list
        run: |
          set -euo pipefail

          compose=$(grep -hoE '^[[:space:]]+image:[[:space:]]*[^[:space:]]+' \
                      deploy/compose/docker-compose.yml \
                    | awk '{print $2}')

          # The Kubernetes side is RENDERED rather than listed, for the same
          # reason the compose side is grepped: no second inventory to drift.
          # `make kind-up` installs these two charts at these two pinned
          # versions, so rendering them yields exactly the images a cluster
          # pulls -- our own values included, which is why Grafana appears
          # here at the digest we pin rather than the chart default.
          kps=$(sed -n 's/^KUBE_PROMETHEUS_STACK_VERSION="\(.*\)"/\1/p' deploy/k8s/scripts/kind-up.sh)
          eg=$(sed -n 's/^ENVOY_GATEWAY_VERSION="\(.*\)"/\1/p' deploy/k8s/scripts/kind-up.sh)
          if [ -z "$kps" ] || [ -z "$eg" ]; then
            echo "cannot read the chart versions from kind-up.sh -- extraction is broken" >&2
            exit 1
          fi
          mise exec -- helm repo add --force-update prometheus-community \
            https://prometheus-community.github.io/helm-charts >/dev/null

          # cluster.yaml contributes the node image: a whole Kubernetes
          # control plane, pulled by every developer running make kind-up.
          k8s=$( {
            mise exec -- helm template kps prometheus-community/kube-prometheus-stack \
              --version "$kps" -n monitoring \
              -f deploy/k8s/kind/kube-prometheus-stack-values.yaml
            mise exec -- helm template eg oci://docker.io/envoyproxy/gateway-helm \
              --version "$eg" -n envoy-gateway-system
            cat deploy/k8s/kind/cluster.yaml
          } | grep -hoE '^[[:space:]]*-?[[:space:]]*image:[[:space:]]*"?[^"[:space:]]+' \
            | sed -E 's/.*image:[[:space:]]*"?//' )

          # devops-demo/* are built and scanned by the gating lane above.
          # The docker.io/ prefix is stripped before deduplicating: compose
          # writes `grafana/grafana` and the chart renders
          # `docker.io/grafana/grafana`, which is one image under two names
          # and would otherwise be scanned twice.
          images=$(printf '%s\n%s\n' "$compose" "$k8s" \
                   | sed -E 's,^docker\.io/,,' \
                   | grep -v '^devops-demo/' | sort -u \
                   | jq -R '{ref: ., name: (split("@")[0])}' | jq -sc .)
          if [ "$(jq 'length' <<<"$images")" -lt 2 ]; then
            echo "extraction produced almost nothing -- it is broken" >&2
            exit 1
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          {
            echo "### Third-party images scanned"
            echo
            jq -r '.[] | "- `\(.name)`"' <<<"$images"
          } >> "$GITHUB_STEP_SUMMARY"

  scan-third-party:
    name: Trivy report (${{ matrix.image.name }})
    needs: collect-third-party
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.collect-third-party.outputs.images) }}
    steps:
      # exit-code 0 on purpose: this lane reports, it does not gate. The
      # severity net is wider than the gating lane above precisely because
      # nothing here can fail the build -- there is no cost to seeing more.
      - name: Trivy scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image.ref }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
