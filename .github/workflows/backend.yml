name: Backend

on:
  pull_request:
    paths:
      - "services/backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "services/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify no generated gRPC/protobuf code is committed
        run: |
          committed=$(git ls-files 'services/backend/app/proto_gen/*')
          if [ -n "$committed" ]; then
            echo "::error::Generated code must never be committed (generate-in-build, RFC-0001 D8, ADR-0002):"
            echo "$committed"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: 'services/backend/pyproject.toml'
          cache: "pip"

      - name: Install dependencies
        working-directory: services/backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run ruff lint
        run: |
          make lint-backend

      - name: Run mypy type check
        run: |
          make type-check

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          # In production, use GitHub Secrets for database credentials
          POSTGRES_DB: appdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: 'services/backend/pyproject.toml'
          cache: "pip"

      - name: Install dependencies
        working-directory: services/backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Generate gRPC/protobuf stubs
        # grpcio-tools bundles its own protoc; no separate buf/protoc
        # install needed here (buf only governs proto/ lint/breaking in
        # proto.yml, a separate workflow) -- RFC-0001 D8, ADR-0002
        run: |
          make generate

      - name: Run migrations
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/appdb
          ALEMBIC_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/appdb
        run: |
          python -m alembic -c alembic.ini upgrade head

      - name: Run tests
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/appdb
          ALEMBIC_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/appdb
        run: |
          pytest -v
