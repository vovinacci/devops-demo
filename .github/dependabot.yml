version: 2
updates:
  # Backend dependencies - all update types enabled (major, minor, patch)
  # Note: Dependabot groups all Python dependencies together since pip doesn't
  # support separate prod/dev groups from the same file. Production dependencies
  # from pyproject.toml [project] and dev dependencies from [project.optional-dependencies]
  # are grouped separately using patterns.
  # Updates are grouped by type: minor/patch updates together, major updates separately.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      backend:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      backend-major:
        patterns:
          - "*"
        update-types: ["major"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "fix"
      include: "scope"

  # Frontend dependencies - npm packages (all update types enabled)
  # Updates are grouped by dependency type (production/development) and update type:
  # minor/patch updates together, major updates separately.
  - package-ecosystem: "npm"
    directory: "/frontend"
    versioning-strategy: "increase"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      frontend-prod:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      frontend-prod-major:
        dependency-type: "production"
        update-types: ["major"]
      frontend-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      frontend-dev-major:
        dependency-type: "development"
        update-types: ["major"]
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "fix"
      include: "scope"

  # Infrastructure - GitHub Actions
  # Updates are grouped by type: minor/patch updates together, major updates separately.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      infra:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      infra-major:
        patterns:
          - "*"
        update-types: ["major"]
    labels:
      - "dependencies"
      - "github-actions"
      - "infra"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Infrastructure dependencies - Docker Compose images
  # Updates are grouped by type: minor/patch updates together, major updates separately.
  # Note: postgres major updates are ignored.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      infra:
        patterns:
          - "*"
        update-types: ["minor", "patch"]   # Group only minor/patch updates into one PR
      infra-major:
        patterns:
          - "*"
        update-types: ["major"]   # Group major updates into separate PR
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]  # Do not propose major updates
    labels:
      - "dependencies"
      - "docker"
      - "infra"
    commit-message:
      prefix: "fix"
      include: "scope"

  # Backend Dockerfile - Python base image (patch updates only)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    groups:
      backend-prod:
        patterns:
          - "python"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependencies"
      - "docker"
      - "backend-prod"
    commit-message:
      prefix: "fix"
      include: "scope"

  # Frontend Dockerfile - Node and nginx base images (minor and patch updates only)
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    groups:
      frontend-prod:
        patterns:
          - "node"
          - "nginx"
        update-types: ["minor", "patch"]   # Group minor/patch updates (major is ignored)
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "nginx"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "docker"
      - "frontend-prod"
    commit-message:
      prefix: "fix"
      include: "scope"
