name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: make doctor output
      description: Paste the full output -- it captures OS, tool versions, and resources.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Service logs (make logs), CI job output, or error messages.
      render: text
