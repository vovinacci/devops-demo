# Git hooks configuration (prek, pre-commit-compatible -- ADR-0012)
# Installation: prek install        (fallback: pip install pre-commit && pre-commit install)
# Manual run:   prek run --all-files (or: make lint-infra)
# CI runs the same config via j178/prek-action -- local == CI by construction.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(services/frontend/|observability/grafana/dashboards/|CHANGELOG\.md)
      - id: end-of-file-fixer
        exclude: ^(services/frontend/|observability/grafana/dashboards/|CHANGELOG\.md)
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags (for Grafana dashboards)
      - id: check-json
        exclude: ^(services/frontend/node_modules/|observability/grafana/dashboards/)
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
        language_version: python3
      - id: detect-private-key
      - id: mixed-line-ending
  # Docker Compose validation
  - repo: local
    hooks:
      - id: docker-compose-validate
        name: docker-compose validate
        entry: bash -c 'docker compose -f deploy/compose/docker-compose.yml --project-directory . config --quiet || (echo "docker-compose config validation failed" && exit 1)'
        language: system
        files: docker-compose\.(yaml|yml)$
        pass_filenames: false
  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        name: hadolint (Dockerfile)
        args:
          - '--ignore'
          - 'DL3008'
          - '--ignore'
          - 'DL3009'
        files: (^|/)Dockerfile$
  # Makefile validation
  - repo: local
    hooks:
      - id: makefile-check
        name: Makefile syntax check
        entry: bash -c 'make -n help > /dev/null 2>&1 || (echo "Makefile syntax error" && exit 1)'
        language: system
        files: Makefile
        pass_filenames: false
  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        # CHANGELOG.md is generated by release-please -- never hand-edited,
        # never linted (generated files are skipped by style checks)
        exclude: ^CHANGELOG\.md$
        args:
          - "-fix"
  # ASCII-only docs (engineering-principles.md Section 1); box-drawing
  # range is allowed anywhere in .md -- pygrep cannot see fence context
  - repo: local
    hooks:
      - id: docs-ascii-lint
        name: ASCII-only docs (use --, ->, x, "Section N")
        language: pygrep
        # bytes regex (pygrep compiles patterns as bytes): a clean line is
        # ASCII or UTF-8 box-drawing (U+2500-257F = e2 94/95 xx); --negate
        # reports every line that is not clean
        entry: '^(?:[\x00-\x7f]|\xe2[\x94\x95][\x80-\xbf])*$'
        args: [--negate]
        files: \.md$
        exclude: ^CHANGELOG\.md$
  # Toolchain drift gate: .mise.toml is the single source of truth for
  # runtime versions; consumers that cannot import it must agree with it
  - repo: local
    hooks:
      - id: toolchain-drift
        name: toolchain versions match .mise.toml
        entry: bash scripts/check-toolchain-drift.sh
        language: system
        files: ^(\.mise\.toml|\.devcontainer/devcontainer\.json|services/frontend/\.nvmrc|services/.*/Dockerfile|services/backend/pyproject\.toml)$
        pass_filenames: false
  # Secret scanning (ADR-0011)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
  # Shell linting: managed environments (pip wheel / Go module), no
  # system binaries -- identical tool versions locally and in CI
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args:
          - "-i"
          - "2"
          - "-ci"
          - "-w"
  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint
        args:
          - "-c=.yamllint.yml"
          - "-s"
        files: \.(yaml|yml)$
        exclude: ^(services/frontend/node_modules/|observability/grafana/dashboards/)
