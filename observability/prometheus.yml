global:
  scrape_interval: 15s
  evaluation_interval: 30s

# Recording rules for SLO, alerting rules
rule_files:
  - /etc/prometheus/prometheus_slo_rules.yml
  - /etc/prometheus/prometheus_alerts.yml

# Alertmanager is core, not profiled (RFC-0001 Section 7, ADR-0007): the
# four alerts above now route through it instead of being visible only
# on the Prometheus Alerts UI/API.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs: [ { targets: ["prometheus:9090"] } ]
  - job_name: "api"
    static_configs: [ { targets: ["api:8000"] } ]
    metrics_path: /metrics
  - job_name: "postgres"
    static_configs: [{ targets: ["postgres_exporter:9187"] }]
  - job_name: "cadvisor"
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: "loki"
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: "alloy"
    static_configs: [{ targets: ["alloy:9080"] }]

  # synthetic profile only (ADR-0007 D9, ADR-0008 D10): blackbox, canary,
  # and the blackbox_http targets below show "down" on the Prometheus
  # targets page when `synthetic` is not up -- expected, documented
  # degradation.
  - job_name: "blackbox"
    static_configs: [{ targets: ["blackbox:9115"] }]

  - job_name: "canary"
    static_configs: [{ targets: ["canary:8080"] }]

  # analytics profile only (RFC-0001 D1, ADR-0008 D10): "down" on the
  # Prometheus targets page when `analytics` is not up -- expected,
  # documented degradation, same as the synthetic-profile targets above.
  - job_name: "analytics"
    static_configs: [{ targets: ["analytics:8082"] }]

  # reports profile only (RFC-0001 D2, Phase 6, ADR-0008 D10): the JVM
  # showcase's whitebox metrics (JVM/GC/heap, HTTP, HikariCP). "down" on
  # the Prometheus targets page when `reports` is not up -- expected,
  # documented degradation, same as the analytics/synthetic targets above.
  - job_name: "reports"
    static_configs: [{ targets: ["reports:8083"] }]
    metrics_path: /metrics

  # reports-ui profile only (RFC-0002 D6, ADR-0013, ADR-0008 D10): Caddy's
  # native metrics, re-exposed on the :8084 site listener by the Caddyfile's
  # `metrics` handler (they live on the admin API by default). "down" on the
  # Prometheus targets page when `reports-ui` is not up -- expected, documented
  # degradation, same as the reports/analytics/synthetic targets above.
  - job_name: "reports-ui"
    static_configs: [{ targets: ["reports-ui:8084"] }]
    metrics_path: /metrics

  - job_name: "blackbox_http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # liveness and readiness both probed -- deliberate, teaching:
          # they diverge under degraded-but-alive conditions
          - http://api:8000/healthz
          - http://api:8000/readyz
          - http://web:80/
          - http://grafana:3000/api/health
          - http://prometheus:9090/-/healthy
          - http://loki:3100/ready
          - http://alloy:9080/-/ready
          - http://cadvisor:8080/healthz
          - http://alertmanager:9093/-/healthy
          - http://mailpit:8025/livez
          # blackbox watching the watcher: the synthetic layer's own
          # liveness, probed from the outside like every other service
          - http://canary:8080/healthz
          # analytics profile only (down when the profile is off, same
          # documented degradation as the synthetic-only targets above)
          - http://analytics:8082/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
