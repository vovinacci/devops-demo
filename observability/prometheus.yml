global:
  scrape_interval: 15s
  evaluation_interval: 30s

# Recording rules for SLO
rule_files:
  - /etc/prometheus/prometheus_slo_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs: [ { targets: ["prometheus:9090"] } ]
  - job_name: "api"
    static_configs: [ { targets: ["api:8000"] } ]
    metrics_path: /metrics
  - job_name: "postgres"
    static_configs: [{ targets: ["postgres_exporter:9187"] }]
  - job_name: "cadvisor"
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: "loki"
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: "alloy"
    static_configs: [{ targets: ["alloy:9080"] }]
