services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devnet
    restart: unless-stopped

  api:
    build:
      context: ./services/backend
      # proto/ is a separate named build context: the backend Dockerfile
      # generates gRPC stubs from the repo-root proto/ module at build time
      # (RFC-0001 D8, ADR-0002), reached without widening this service's own
      # build context.
      additional_contexts:
        - proto=./proto
      target: runtime
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-appdb}
      - ALEMBIC_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-appdb}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "50051:50051" # gRPC ItemService (RFC-0001 D3): backend serves, analytics dials
    labels:
      - "environment=${ENVIRONMENT:-development}"
    networks:
      - devnet
    restart: unless-stopped
    healthcheck:
      # HTTP /healthz liveness AND the gRPC Health Checking Protocol on
      # :50051 -- both must pass (RFC-0001 D6); app.healthcheck is the same
      # module the image's own HEALTHCHECK runs, kept in one place
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Development command (default)
    command: >
      sh -c "python -m alembic -c /app/alembic.ini upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    deploy:
      resources:
        limits: {}
        #  cpus: 1
        #  memory: 1G
        reservations: {}
        #  cpus: 2
        #  memory: 2G

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    # The image's own default CMD is exactly the first two flags below
    # (`--config.file=/etc/prometheus/prometheus.yml
    # --storage.tsdb.path=/prometheus`, see prom/prometheus's Dockerfile)
    # -- a `command:` override replaces CMD entirely, so both are
    # repeated here explicitly alongside the new flag this service exists
    # to add. `--web.enable-remote-write-receiver` (RFC-0001 D4, ADR-0006)
    # is required for k6's `-o experimental-prometheus-rw` output
    # (loadgen/README.md) to have anywhere to push to.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus_slo_rules.yml:/etc/prometheus/prometheus_slo_rules.yml:ro
      - ./observability/prometheus_alerts.yml:/etc/prometheus/prometheus_alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - devnet
    restart: unless-stopped
    # No depends_on on alertmanager, deliberately (ADR-0008 D10 graceful
    # degradation, same reasoning as grafana -> prometheus below):
    # Prometheus's alerting: block is static-config discovery, tolerated
    # being absent or started later, same as any other scrape target.

  # Alerting layer (RFC-0001 Section 7, ADR-0007): core, not profiled --
  # observability is the repo's promise, not an opt-in extra (D10
  # principle, same reasoning as prometheus/grafana/loki above). Routes,
  # groups, and inhibits the four alerts in prometheus_alerts.yml; config
  # as code under observability/alertmanager/.
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # silences and notification-log state live here -- without it a
      # container recreation silently drops every active silence
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      mailpit:
        condition: service_healthy
    networks:
      - devnet
    restart: unless-stopped
    healthcheck:
      # image ships wget (see blackbox-exporter above for the same
      # pattern) -- /-/healthy is Alertmanager's own liveness endpoint.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Visible dummy receiver (RFC-0001 Section 7, amended during Phase 4:
  # originally MailHog, unmaintained; Mailpit is its maintained
  # successor). SMTP sink only reachable in-network -- no host port on
  # :1025, nothing outside the compose network should ever submit mail
  # to it directly; the web UI at :8025 is the only host-exposed surface,
  # for a student to watch a notification arrive.
  mailpit:
    image: axllent/mailpit:v1.27.5@sha256:5921fa3c3f0a34eb000a89ac8279d1f9d711e486a9a8fd094f7db5a1920256ab
    ports:
      - "8025:8025"
    networks:
      - devnet
    restart: unless-stopped
    healthcheck:
      # image ships wget -- /livez is Mailpit's own liveness endpoint.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-appdb}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9187:9187"
    networks:
      - devnet
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_DISABLE_INITIAL_ADMIN_PASSWORD_CHANGE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/dashboards
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - devnet
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.3@sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8
    command: -config.file=/etc/loki/config.yml -target=all
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - devnet
    restart: unless-stopped
    # no container healthcheck: grafana/loki images are distroless since 3.5
    # (no shell, no wget -- nothing to exec); readiness is observed from
    # outside via /ready (Prometheus scrape; blackbox probe in a later phase)

  # Promtail is deprecated (EOL March 2026), migrated to Grafana Alloy
  # See: https://grafana.com/docs/alloy/latest/set-up/migrate/from-promtail/
  alloy:
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    command: run --server.http.listen-addr=0.0.0.0:9080 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        # service_started, not service_healthy: the distroless loki image
        # cannot carry a container healthcheck (see loki service above)
        condition: service_started
    networks:
      - devnet
    restart: unless-stopped
    healthcheck:
      # readiness only, probed via bash /dev/tcp -- the alloy image ships no
      # wget/curl. Write-error visibility (dropped lines) is a Prometheus
      # concern, not a container healthcheck.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9080 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    # dockerd's bundled containerd socket -- cadvisor's default
    # (/run/containerd/containerd.sock) is the standalone-containerd path;
    # without this the docker factory fails and metrics lose container
    # names and compose labels (raw cgroup fallback)
    command:
      - -logtostderr
      - --containerd=/var/run/docker/containerd/containerd.sock
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - devnet
    restart: unless-stopped

  web:
    build:
      context: ./services/frontend
      target: runtime
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - devnet
    restart: unless-stopped

  # analytics profile (RFC-0001 D1, ADR-0005, ADR-0008 D10): opt-in via
  # `make up-full` or `--profile analytics`; core stack is profile-less.
  # Own Postgres instance -- service-owns-its-store must be visible in
  # the compose topology, not a second database on `db`.
  postgres-analytics:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    profiles:
      - analytics
    environment:
      POSTGRES_DB: ${ANALYTICS_POSTGRES_DB:-analytics}
      POSTGRES_USER: ${ANALYTICS_POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${ANALYTICS_POSTGRES_PASSWORD:-analytics}
    volumes:
      - pgdata-analytics:/var/lib/postgresql/data
    ports:
      # host 5433 for parity with db's host 5432 (both map to container 5432)
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_POSTGRES_USER:-analytics} -d ${ANALYTICS_POSTGRES_DB:-analytics}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devnet
    restart: unless-stopped

  # analytics profile (RFC-0001 D1): the Go analytics service. Ships the
  # gRPC ingest client (RFC-0001 Phase 3 PR-B): dials the backend's
  # ItemService and reconnects on its own (ADR-0002) -- no depends_on on
  # `api` here deliberately, matching D10 graceful degradation: analytics
  # must tolerate the backend (or the whole `core` profile) being absent
  # or started later, backing off and reconnecting instead of failing.
  analytics:
    build:
      context: ./services/analytics
      # proto/ and loadprofile/ are separate named build contexts, same
      # pattern as `api` for proto/ (RFC-0001 D8, ADR-0002) and `loadgen`
      # for loadprofile/: Go gRPC stubs are generated at build time via
      # buf, never committed; loadprofile/profile.json is read at
      # runtime by the `seed` subcommand (RFC-0001 Phase 5 D5), copied
      # straight into the runtime image (see services/analytics/Dockerfile).
      additional_contexts:
        - proto=./proto
        - loadprofile=./loadprofile
    profiles:
      - analytics
    environment:
      - ANALYTICS_DATABASE_URL=postgres://${ANALYTICS_POSTGRES_USER:-analytics}:${ANALYTICS_POSTGRES_PASSWORD:-analytics}@postgres-analytics:5432/${ANALYTICS_POSTGRES_DB:-analytics}?sslmode=disable
      # In-network target (ADR-0002): analytics dials `api:50051`, the
      # same backend gRPC port exposed to the host at localhost:50051
      # above. The binary's own default (localhost:50051) is for running
      # `go run ./cmd/analytics serve` against a backend also run
      # locally, outside compose -- same local-vs-compose split as
      # ANALYTICS_DATABASE_URL just above.
      - ANALYTICS_BACKEND_GRPC_ADDR=api:50051
      # Only consumed by the `seed` subcommand (RFC-0001 Phase 5 D5);
      # harmless to always set, same as the ingest/retention env vars
      # above that `serve` alone reads. Path baked in by the Dockerfile's
      # loadprofile build context (see services/analytics/Dockerfile).
      - ANALYTICS_LOADPROFILE_PATH=/etc/analytics/loadprofile/profile.json
      - DEMO_TIME_SCALE=${DEMO_TIME_SCALE:-1}
    depends_on:
      postgres-analytics:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - devnet
    restart: unless-stopped
    healthcheck:
      # distroless/static runtime ships no shell/wget -- the binary's own
      # `healthcheck` subcommand replaces the CMD-SHELL/wget pattern the
      # other services' healthchecks use (see services/analytics/Dockerfile).
      test: ["CMD", "/usr/local/bin/analytics", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # synthetic profile (ADR-0007 D9 blackbox layer, ADR-0008 D10): opt-in via
  # `make up-full` or `--profile synthetic`; core stack is profile-less.
  blackbox:
    image: prom/blackbox-exporter:v0.26.0@sha256:92e05d5fe0df01d3980518dc42f07b778a8997048b57392ebc7f7391ebd7bb06
    profiles:
      - synthetic
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - devnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # synthetic profile (ADR-0007 D9 synthetic layer): the Rust canary.
  # depends_on api with service_started, not service_healthy -- observing
  # a down backend is the canary's job (RFC-0001 D10 graceful degradation);
  # it must be able to start and report failures even while api is down.
  # No depends_on on analytics, deliberately (RFC-0001 D9 v2, ADR-0008
  # D10): the `synthetic` profile must run standalone, with `analytics`
  # absent -- the pipeline-lag step skips instead of failing the journey.
  canary:
    build:
      context: ./services/canary
    profiles:
      - synthetic
    environment:
      - CANARY_BACKEND_URL=http://api:8000
      - CANARY_ANALYTICS_URL=http://analytics:8082
    depends_on:
      api:
        condition: service_started
    ports:
      - "8085:8080"
    networks:
      - devnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # load profile (RFC-0001 D4, ADR-0006): opt-in via `make up-full` or
  # `--profile load`. depends_on api with service_started ONLY (D10, same
  # graceful-degradation principle as analytics/canary above): the
  # long-running k6 process is designed to tolerate api being briefly
  # unready (ordinary HTTP failures at scenario level) rather than
  # refusing to start entirely.
  loadgen:
    build:
      context: ./loadgen
      # loadprofile/ and proto/ are separate named build contexts, same
      # pattern as `api`/`analytics` for proto/ (RFC-0001 D8, ADR-0002):
      # k6 imports shape.js/profile.json directly and loads items.proto
      # at runtime (loadgen/README.md).
      additional_contexts:
        - loadprofile=./loadprofile
        - proto=./proto
    profiles:
      - load
    environment:
      - DEMO_TIME_SCALE=${DEMO_TIME_SCALE:-1}
      - LOADGEN_BACKEND_URL=http://api:8000
      - LOADGEN_WEB_URL=http://web:80
      - LOADGEN_GRPC_ADDR=api:50051
      - LOADGEN_DURATION_HOURS=${LOADGEN_DURATION_HOURS:-24}
      - LOADGEN_STAGE_MINUTES=${LOADGEN_STAGE_MINUTES:-15}
      - LOADGEN_PREALLOCATED_VUS=${LOADGEN_PREALLOCATED_VUS:-10}
      - LOADGEN_MAX_VUS=${LOADGEN_MAX_VUS:-50}
      # k6 built-in Prometheus remote-write output (RFC-0001 D4/Section 7,
      # ADR-0006): Prometheus needs --web.enable-remote-write-receiver
      # (see the prometheus service's command: above) for this endpoint
      # to accept writes at all.
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),avg
    depends_on:
      api:
        condition: service_started
    networks:
      - devnet
    # The long-running scenario set (loadgen/scenarios/main.js) runs for
    # LOADGEN_DURATION_HOURS (default 24h) of precomputed stages, then
    # exits -- `restart: unless-stopped` is what brings it back with a
    # fresh LOADGEN_REF_UNIX (loadgen/entrypoint.sh), not a script-level
    # loop.
    restart: unless-stopped

volumes:
  dbdata: {}
  pgdata-analytics: {}
  loki-data: {}
  alloy-data: {}
  grafana-data: {}
  alertmanager-data: {}

networks:
  devnet: {}
