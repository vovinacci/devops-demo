# Loki: third-party image (digest pinned from compose). Distroless, so probes
# are kubelet-side httpGet against Lokis own /ready. NO ServiceMonitor
# (RFC-0003 Section 6 leaves Lokis scrape out); the Alloy DaemonSet that ships
# logs into it lands in PR-4.
image:
  repository: grafana/loki
  tag: 3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
replicaCount: 1
containerPort: 3100
portName: http
# Compose bind-mounts this file; here it is a ConfigMap the pod mounts, and
# the same -config.file argument points at it (RFC-0003 DK8). The copy under
# files/ is diffed against the compose original by the k8s gate.
# args, not command: compose's `command:` overrides CMD, and the Kubernetes
# equivalent of CMD is args. Putting these in `command` would replace the
# image's ENTRYPOINT (/usr/bin/loki) and try to exec the flag itself.
args:
  - -config.file=/etc/loki/config.yml
  - -target=all
configFiles:
  - name: config.yml
    path: files/config.yml
configFilesMountPath: /etc/loki
# Compose gives Loki a named volume; the same durability here is a claim.
# ReadWriteOnce binds to one node, so the rollout has to be Recreate for the
# same reason the reports Deployment does.
strategy:
  type: Recreate
extraPVCs:
  - name: data
    size: 2Gi
    accessMode: ReadWriteOnce
pvcMounts:
  - name: data
    mountPath: /loki
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
service:
  enabled: true
  type: ClusterIP
d6:
  liveness:
    type: httpGet
    path: /ready
    port: http
  readiness:
    type: httpGet
    path: /ready
    port: http
  serviceMonitor:
    enabled: false
