# Backend: the D6-compliant reference service. REST + gRPC (RFC-0001 D3).
image:
  repository: devops-demo/backend
  tag: dev
replicaCount: 1
containerPort: 8000
portName: http
extraPorts:
  # gRPC ItemService: backend serves, analytics dials (RFC-0001 D3). Exposed
  # in the Service; no Gateway route until PR-3 (GRPCRoute).
  - name: grpc
    containerPort: 50051
# Settings split by KIND of data (RFC-0003 DK8): plain settings in a
# ConfigMap, anything carrying a password in a Secret. Both arrive as
# environment variables via envFrom, so the app code is identical to compose.
config:
  ENVIRONMENT: production
# Both DSNs embed the demo password, so both are credentials -- the driver
# prefix is the only difference (asyncpg for the app, psycopg for Alembic).
secret:
  DATABASE_URL: "postgresql+asyncpg://app:app@{{ .Release.Name }}-postgres-backend:5432/appdb"
  ALEMBIC_DATABASE_URL: "postgresql+psycopg://app:app@{{ .Release.Name }}-postgres-backend:5432/appdb"
# Alembic runs as a Helm hook Job on every install and upgrade, using this
# same image and the ALEMBIC_DATABASE_URL from the Secret above
# (templates/migration-job.yaml). Under compose the equivalent step is
# `make seed`, run by hand.
migrationJob:
  enabled: true
  command: ["python", "-m", "alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
  backoffLimit: 6
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi
service:
  enabled: true
  type: ClusterIP
d6:
  liveness:
    type: httpGet
    path: /healthz
    port: http
  readiness:
    type: httpGet
    path: /readyz
    port: http
  # gRPC Health Checking Protocol on :50051 (RFC-0003 DK4). k8s allows one
  # handler per probe, so the gRPC check rides the startupProbe -- the D6 HTTP
  # liveness/readiness pair above is preserved, and liveness does not begin
  # until the gRPC server reports serving.
  startup:
    type: grpc
    port: 50051
    periodSeconds: 5
    failureThreshold: 30
  serviceMonitor:
    enabled: true
    path: /metrics
    port: http
    interval: 30s
