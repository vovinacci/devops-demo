# Backend: the D6-compliant reference service. REST + gRPC (RFC-0001 D3).
image:
  repository: devops-demo/backend
  tag: dev
replicaCount: 1
containerPort: 8000
portName: http
extraPorts:
  # gRPC ItemService: backend serves, analytics dials (RFC-0001 D3). Exposed
  # in the Service; no Gateway route until PR-3 (GRPCRoute).
  - name: grpc
    containerPort: 50051
# DATABASE_URL / ALEMBIC_DATABASE_URL move to a ConfigMap/Secret in PR-3
# (RFC-0003 DK8). PR-2 renders the D6 shape only.
env:
  - name: ENVIRONMENT
    value: production
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi
service:
  enabled: true
  type: ClusterIP
d6:
  liveness:
    type: httpGet
    path: /healthz
    port: http
  readiness:
    type: httpGet
    path: /readyz
    port: http
  # gRPC Health Checking Protocol on :50051 (RFC-0003 DK4). k8s allows one
  # handler per probe, so the gRPC check rides the startupProbe -- the D6 HTTP
  # liveness/readiness pair above is preserved, and liveness does not begin
  # until the gRPC server reports serving.
  startup:
    type: grpc
    port: 50051
    periodSeconds: 5
    failureThreshold: 30
  serviceMonitor:
    enabled: true
    path: /metrics
    port: http
    interval: 30s
