# Postgres: ONE StatefulSet template (RFC-0003 DK7, ADR-0018), instantiated
# three times by the umbrella via dependency aliases (postgres-backend /
# postgres-analytics / postgres-reports) -- three StatefulSets, three owners,
# no shared volume (RFC-0001 D1 "service owns its store" stays visible in the
# topology). Headless Service for stable DNS identity; PVC per replica.
# Credentials are demo-grade defaults here (same posture as compose); they
# move to Secrets in PR-3 (RFC-0003 DK8).
image:
  repository: postgres
  tag: 16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
  digest: sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
replicaCount: 1
containerPort: 5432
portName: postgresql
env:
  - name: POSTGRES_DB
    value: appdb
  - name: POSTGRES_USER
    value: app
  - name: POSTGRES_PASSWORD
    value: app
  - name: PGDATA
    value: /var/lib/postgresql/data/pgdata
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
service:
  enabled: true
  type: ClusterIP
  headless: true
volumeMounts:
  - name: data
    mountPath: /var/lib/postgresql/data
persistence:
  volumeClaims:
    - name: data
      size: 1Gi
      accessMode: ReadWriteOnce
d6:
  liveness:
    type: exec
    command: ["pg_isready", "-U", "app", "-d", "appdb"]
    periodSeconds: 10
    timeoutSeconds: 3
  readiness:
    type: exec
    command: ["pg_isready", "-U", "app", "-d", "appdb"]
    periodSeconds: 5
    timeoutSeconds: 3
  serviceMonitor:
    enabled: false
