# Loadgen: a long-running k6 process (RFC-0001 D4). It has no HTTP listener,
# so it renders a Deployment + ServiceAccount only -- no Service (nothing to
# select), no probes (no endpoint), no ServiceMonitor. The opt-out flags below
# express that honestly.
image:
  repository: devops-demo/loadgen
  tag: dev
replicaCount: 1
# Upstreams and tuning knobs, no credentials (RFC-0003 DK8).
config:
  DEMO_TIME_SCALE: "1"
  LOADGEN_BACKEND_URL: "http://{{ .Release.Name }}-backend:8000"
  LOADGEN_WEB_URL: "http://{{ .Release.Name }}-frontend:80"
  LOADGEN_GRPC_ADDR: "{{ .Release.Name }}-backend:50051"
  LOADGEN_ANALYTICS_URL: "http://{{ .Release.Name }}-analytics:8082"
  LOADGEN_DURATION_HOURS: "24"
  LOADGEN_STAGE_MINUTES: "15"
  LOADGEN_PREALLOCATED_VUS: "10"
  LOADGEN_MAX_VUS: "50"
  # k6's built-in remote-write output (RFC-0001 D4, ADR-0006). The image CMD
  # already passes -o experimental-prometheus-rw, so without this the writes
  # go to k6's default localhost and fail every flush. Prometheus must also
  # accept them: enableRemoteWriteReceiver in the stack values, the counterpart
  # of compose's --web.enable-remote-write-receiver flag.
  K6_PROMETHEUS_RW_SERVER_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write"
  K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
service:
  enabled: false
d6:
  liveness:
    type: none
  readiness:
    type: none
  serviceMonitor:
    enabled: false
