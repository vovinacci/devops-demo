# Canary: Rust synthetic-journey service, D6-compliant.
image:
  repository: devops-demo/canary
  tag: dev
replicaCount: 1
containerPort: 8080
portName: http
# Upstreams only -- no credentials, so no Secret. analytics and reports belong
# to other profiles and may be absent; the journey skips those steps rather
# than failing (RFC-0001 D10 graceful degradation), exactly as under compose.
config:
  CANARY_BACKEND_URL: "http://{{ .Release.Name }}-backend:8000"
  CANARY_ANALYTICS_URL: "http://{{ .Release.Name }}-analytics:8082"
  CANARY_REPORTS_URL: "http://{{ .Release.Name }}-reports:8083"
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi
service:
  enabled: true
  type: ClusterIP
d6:
  liveness:
    type: httpGet
    path: /healthz
    port: http
  readiness:
    type: httpGet
    path: /readyz
    port: http
  serviceMonitor:
    enabled: true
    path: /metrics
    port: http
    interval: 30s
