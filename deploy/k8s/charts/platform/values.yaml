# Base overlay = the `core` profile (RFC-0001 D10): the profile-less compose
# stack. `helm template platform -f values.yaml` renders exactly the core
# services; the additive profiles are off and turned on by layering a
# values-<profile>.yaml overlay (-f), which mirrors `--profile <name>`.
#
# NOTE: prometheus / grafana / alertmanager / alloy / cadvisor are NOT charted
# here -- RFC-0003 Section 6 marks them as coming from kube-prometheus-stack
# and a DaemonSet in PR-4. cadvisor is retired outright (the kubelet already
# exposes cAdvisor metrics). This umbrella charts the application + supporting
# services only.

# --- edge (ADR-0016) -----------------------------------------------------
# One Gateway; the Routes below it are rendered per enabled service by
# templates/gateway.yaml. Grafana's route arrives in PR-4 with Grafana itself.
gateway:
  enabled: true
  className: eg
  # Every route is <service>.<domain>. The .localhost tree is loopback by
  # RFC 6761, so these resolve with no /etc/hosts entry on macOS and on
  # systemd-resolved.
  domain: devops-demo.localhost
  # Kind-only; set by deploy/k8s/scripts/kind-deploy.sh. Empty here keeps the
  # chart portable (see deploy/k8s/kind/envoyproxy.yaml).
  envoyProxyRef: ""

# --- core (on) -----------------------------------------------------------
backend:
  enabled: true
frontend:
  enabled: true
postgres-backend:
  enabled: true
postgres-exporter:
  enabled: true
mailpit:
  enabled: true
loki:
  enabled: true

# --- +analytics (off) ----------------------------------------------------
analytics:
  enabled: false
postgres-analytics:
  enabled: false
  # Own store, own credentials (RFC-0001 D1) -- the alias overrides both the
  # ConfigMap and the Secret the postgres chart defaults to (RFC-0003 DK8).
  config:
    POSTGRES_DB: analytics
    POSTGRES_USER: analytics
    PGDATA: /var/lib/postgresql/data/pgdata
  secret:
    POSTGRES_PASSWORD: analytics
  d6:
    liveness:
      type: exec
      command: ["pg_isready", "-U", "analytics", "-d", "analytics"]
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      type: exec
      command: ["pg_isready", "-U", "analytics", "-d", "analytics"]
      periodSeconds: 5
      timeoutSeconds: 3
    serviceMonitor:
      enabled: false

# --- +reports (off) ------------------------------------------------------
reports:
  enabled: false
postgres-reports:
  enabled: false
  config:
    POSTGRES_DB: reports
    POSTGRES_USER: reports
    PGDATA: /var/lib/postgresql/data/pgdata
  secret:
    POSTGRES_PASSWORD: reports
  d6:
    liveness:
      type: exec
      command: ["pg_isready", "-U", "reports", "-d", "reports"]
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      type: exec
      command: ["pg_isready", "-U", "reports", "-d", "reports"]
      periodSeconds: 5
      timeoutSeconds: 3
    serviceMonitor:
      enabled: false

# --- +reports-ui (off) ---------------------------------------------------
reports-ui:
  enabled: false

# --- +synthetic (off) ----------------------------------------------------
blackbox:
  enabled: false
canary:
  enabled: false

# --- +load (off) ---------------------------------------------------------
loadgen:
  enabled: false
