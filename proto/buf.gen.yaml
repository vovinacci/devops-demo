version: v2
# Python codegen, offline (no network, no buf.build remote plugins).
#
# python_out / pyi_out use buf's own vendored protoc builtins -- verified
# to require zero Python toolchain (tested: `buf generate` alone produces
# both, no grpcio-tools installed). grpc_python (service stubs) is
# deliberately NOT wired here: grpcio-tools does not ship a standalone
# `protoc-gen-grpc_python` executable (verified) -- `python -m
# grpc_tools.protoc` is a monolithic protoc replacement with
# --grpc_python_out baked in, not a spawnable protoc plugin, so it cannot
# be declared as a buf `local` plugin. Service stubs are generated by a
# second, direct `python -m grpc_tools.protoc --grpc_python_out=...`
# invocation in the backend's `make generate` target (PR-2), reading the
# same proto/ module.
#
# Out dir chosen for PR-2: services/backend/app/proto_gen (gitignored,
# generate-in-build per RFC-0001 D8 / ADR-0002 -- never committed).
plugins:
  - protoc_builtin: python
    out: ../services/backend/app/proto_gen
  - protoc_builtin: pyi
    out: ../services/backend/app/proto_gen
